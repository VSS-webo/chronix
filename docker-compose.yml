services:

  postgres:
    image: postgres:16
    container_name: chronix-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: chronix
      POSTGRES_PASSWORD: chronix
      POSTGRES_DB: chronix

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  minio:
    image: quay.io/minio/minio:latest
    container_name: chronix-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: chronix
      MINIO_ROOT_PASSWORD: chronixsecret

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data


volumes:
  postgres_data:
  minio_data:
